apiVersion: v1
kind: Namespace
metadata:
  name: demo0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: demo0
  name: echo0
  labels:
    app.kubernetes.io/name: echo0
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: echo0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: echo0
    spec:
      containers:
        - name: echo0
          image: hashicorp/http-echo
          args:
            - -listen=:8000
            - -text=echo0
          resources:
            limits:
              cpu: 10m
              memory: 50Mi
---
apiVersion: v1
kind: Service
metadata:
  namespace: demo0
  name: echo0
  labels:
    app.kubernetes.io/name: echo0
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: echo0
  ports:
    - protocol: TCP
      appProtocol: http
      port: 8000
      targetPort: 8000
